# SITE SETUP
# Guide: https://docs.hugoblox.com/tutorial/
# Documentation: https://docs.hugoblox.com/
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Appearance

appearance:
  theme_day: minimal
  theme_night:
  font: native
  font_size: L

# SEO

marketing:
  seo:
    site_type: Person
    local_business_type: ''
    org_name: 'Laboratoire d''Acoustique de l''Université du Mans (LAUM, UMR 6613 CNRS)'
    description: 'Vassos Achilleos, CNRS researcher (Chargé de recherche) at LAUM, Le Mans Université: acoustics, non-Hermitian and active wave physics, ERC Starting Grant NASA.'
    twitter: ''
  analytics:
    google_analytics: ''
    baidu_tongji: ''
    google_tag_manager: ''
    microsoft_clarity: ''
  verification:
    # Paste ONLY the content="..." value of the HTML-tag method from Google Search Console
    # (Settings > Ownership verification > HTML tag), e.g. google: 'AbCdEf123...'
    google: 'WmACeK3EvL7nSXYQjQKFF6yzgOsi0-H1gc2iucnkFWU'
    baidu: ''

# Person structured data (schema.org) — used by layouts/partials/hooks/head-end/person-jsonld.html
# Add every profile that is unambiguously yours to same_as (ORCID, HAL, ResearchGate, LinkedIn...).
# Google uses these links to tie the profiles together and to the site.

person:
  name: Vassos Achilleos
  given_name: Vassos
  family_name: Achilleos
  job_title: 'Chargé de recherche CNRS (CNRS researcher)'
  email: achilleos.vassos@univ-lemans.fr
  image: img/portrait.jpg
  works_for:
    - name: 'Laboratoire d''Acoustique de l''Université du Mans (LAUM, UMR 6613 CNRS)'
      url: 'https://laum.univ-lemans.fr'
    - name: CNRS
      url: 'https://www.cnrs.fr'
  affiliation:
    - name: Le Mans Université
      url: 'https://www.univ-lemans.fr'
  knows_about:
    - Acoustics
    - Acoustic waveguides
    - Nonlinear acoustics
    - Sound absorption
    - Non-Hermitian physics
    - Non-Hermitian skin effect
    - Exceptional points
    - Acoustic metamaterials
  same_as:
    - 'https://scholar.google.com/citations?user=agupRD8AAAAJ'
    # - 'https://orcid.org/XXXX-XXXX-XXXX-XXXX'
    # - 'https://cv.hal.science/YOUR-IDHAL'
    # - 'https://www.researchgate.net/profile/Vassos-Achilleos'
    # - 'https://www.linkedin.com/in/YOUR-HANDLE'

# Site header

header:
  navbar:
    enable: true
    align: r
    show_logo: true
    show_language: false
    show_day_night: true
    show_search: true
    highlight_active_link: false

# Site footer

footer:
  copyright:
    notice: '<span class="footer-logos"><a href="https://www.cnrs.fr" target="_blank" rel="noopener"><img src="/img/cnrs-logo.png" alt="CNRS"></a><a href="https://www.univ-lemans.fr" target="_blank" rel="noopener"><img src="/img/lemans-univ-logo.png" alt="Le Mans Université"></a><a href="https://laum.univ-lemans.fr" target="_blank" rel="noopener"><img src="/img/laum-logo.png" alt="LAUM"></a><a href="https://erc.europa.eu" target="_blank" rel="noopener"><img src="/img/eu-erc-logo.png" alt="Funded by the European Union — ERC"></a></span><br>© {year} Vassos Achilleos — LAUM, CNRS / Le Mans Université'
    license:
      enable: false
      allow_derivatives: false
      share_alike: true
      allow_commercial: false

# Localization

locale:
  date_format: '2 Jan 2006'
  time_format: '3:04 PM'
  address_format: en-us

# Site features

features:
  syntax_highlighter:
    enable: false
    extra_languages:
      - r
      - latex
  math:
    enable: false
  privacy_pack:
    enable: false
  repository:
    url: 'https://github.com/<username>/<repository>'
    content_dir: content
    branch: main
  avatar:
    gravatar: false
    shape: circle
  comment:
    provider: ''
    disqus:
      shortname: ''
      show_count: true
    commento:
      url: ''
    giscus:
      repo: ''
      repo_id: ''
      category: ''
      category_id: ''
  search:
    provider: wowchemy
    algolia:
      app_id: ''
      api_key: ''
      index_name: ''
      show_logo: false
  map:
    provider: 'mapnik'
    api_key: ''
    zoom: 15

# Extensions

extensions:
  decap_cms:
    branch: main
    local_backend: false
  academicons:
    enable: true

# Citation style

publications:
  date_format: January 2006
  citation_style: apa
